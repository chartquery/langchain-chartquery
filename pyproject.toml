[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "langchain-chartquery"
version = "0.1.0"
description = "LangChain tools for ChartQuery: turn data into charts, descriptions into diagrams, and text into QR codes, as image links."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "ChartQuery", email = "contact@chartquery.com" },
]
keywords = ["langchain", "chartquery", "tools", "agents", "charts", "chartjs", "diagrams", "mermaid", "qrcode", "data-visualization"]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "langchain-core>=0.3.15,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = [
  "langchain-tests>=0.3.5",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8,<1",
]

[project.urls]
Homepage = "https://www.chartquery.com"
Documentation = "https://github.com/chartquery/langchain-chartquery#readme"
Repository = "https://github.com/chartquery/langchain-chartquery"
Issues = "https://github.com/chartquery/langchain-chartquery/issues"

[tool.hatch.build.targets.sdist]
include = ["/langchain_chartquery", "/tests", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_chartquery"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
